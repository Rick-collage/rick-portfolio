<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" fill="none">
  <!-- Stylized RICK. logo mark -->
  <defs>
    <linearGradient id="rickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Bold R lettermark -->
  <text x="4" y="36" font-family="Arial Black, Impact, sans-serif" font-size="36" font-weight="900" fill="url(#rickGrad)" letter-spacing="-1.5" filter="url(#glow)">RICK</text>
  <!-- Accent dot -->
  <circle cx="148" cy="32" r="5" fill="#c084fc">
    <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
